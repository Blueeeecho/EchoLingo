<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>贴图 · EchoLingo</title></head>
<body>
  <div class="actions" aria-label="贴图操作"><button id="toggle-pin" aria-label="取消置顶" aria-pressed="true" title="取消置顶（图片仍会保留）" disabled><svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-1 6 4 4v2H5v-2l4-4Z"/><path d="M12 15v7"/></svg></button><button id="close-pin" aria-label="关闭贴图" title="关闭贴图，不保存文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></button></div>
  <main><img id="pinned-image" alt="已固定的截图（包含编辑后的标注）" draggable="false" hidden/></main>
  <div id="resize-edges" aria-hidden="true"><i data-direction="North"></i><i data-direction="NorthEast"></i><i data-direction="East"></i><i data-direction="SouthEast"></i><i data-direction="South"></i><i data-direction="SouthWest"></i><i data-direction="West"></i><i data-direction="NorthWest"></i></div>
  <p id="pin-status" role="status">正在准备贴图…</p>
  <script type="module" src="/src/pinned-screenshot.ts"></script>
</body></html>
