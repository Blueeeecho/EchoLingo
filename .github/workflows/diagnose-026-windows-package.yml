name: Diagnose immutable Windows candidate byte difference
on:
  push:
    branches: [verify/026-windows-package]
permissions:
  contents: read
  actions: read
jobs:
  diagnose-windows-package:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require the pinned product tree and diagnosis-only additions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          source='d91b59505f81d766eca25a8cff4764c278542275'
          assert subprocess.check_output(['git','rev-parse',source+'^{tree}'],text=True).strip() == '2898ee1bad7f1d73d408d2ad5fc136cfc869fe3a'
          changed=set(subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines())
          assert changed == {'.github/workflows/diagnose-026-windows-package.yml','scripts/diagnose-026-windows-package.py'}
          PY
      - name: Download only the immutable generated Windows build
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'), path=require('node:path'), crypto=require('node:crypto');
            if(context.repo.owner!=='Blueeeecho'||context.repo.repo!=='EchoLingo'||context.ref!=='refs/heads/verify/026-windows-package'||context.eventName!=='push')throw new Error('Wrong diagnosis context');
            const base={owner:'Blueeeecho',repo:'EchoLingo'};
            const {data:artifact}=await github.rest.actions.getArtifact({...base,artifact_id:13040982741});
            const sha='4787f328c08f8b9e4afd9a2881efcac192047cc38e73c5a9ae3add1b86116618';
            if(artifact.expired||artifact.workflow_run.id!==41195400127||artifact.workflow_run.head_sha!=='d91b59505f81d766eca25a8cff4764c278542275'||artifact.name!=='EchoLingo-0.2.6-UNVERIFIED-build-Windows'||artifact.size_in_bytes!==79796541||artifact.digest!==`sha256:${sha}`)throw new Error('Wrong original artifact');
            const {data}=await github.rest.actions.downloadArtifact({...base,artifact_id:13040982741,archive_format:'zip'});
            const bytes=Buffer.from(data);
            if(bytes.length!==79796541||crypto.createHash('sha256').update(bytes).digest('hex')!==sha)throw new Error('Original bytes changed');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'original-windows-build.zip'),bytes,{flag:'wx'});
      - name: Compare known executable bytes without accepting modifying or launching them
        run: python scripts/diagnose-026-windows-package.py
      - name: Preserve generated byte metadata only
        uses: actions/upload-artifact@v4
        with:
          name: windows-026-package-byte-diagnosis
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/windows-package-byte-diagnosis/BYTE-DIAGNOSIS.json
            ${{ runner.temp }}/windows-package-byte-diagnosis/7z-listing.txt
            ${{ runner.temp }}/windows-package-byte-diagnosis/UNVERIFIED-BUILD.json
