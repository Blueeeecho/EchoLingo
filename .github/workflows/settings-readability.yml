name: Settings readability
on:
  pull_request:
    paths:
      - .github/workflows/settings-readability.yml
      - index.html
      - package.json
      - package-lock.json
      - src/styles.css
      - src/settings-readability.css
      - src/main.ts
      - src/free-setup-ui.ts
      - src/service-manager.ts
      - src/service-guide*
      - src/service-quota*
      - tests/settings-readability.mjs
      - tests/free-setup-ui.test.ts
      - tests/service-quota-ui.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: settings-readability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  settings-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check settings code and service links
        run: |
          npm run check
          npx vitest run tests/free-setup-ui.test.ts tests/free-setup.test.ts tests/service-quotas.test.ts
          npm run build
          python3 scripts/check-repository.py
      - name: Prepare CJK fonts and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          task_browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$task_browser" ]; then
            echo "ECHOLINGO_TEST_CHROMIUM=$task_browser" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - name: Check settings typography, links and narrow layouts
        run: |
          npm run dev > "$RUNNER_TEMP/settings-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail -s http://127.0.0.1:1420/ > /dev/null
          npm run test:settings-ui
      - name: Preserve generated settings screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settings-readability-ui
          if-no-files-found: warn
          path: |
            test-results/service-manager-readability-*.png
            test-results/service-manager-add-readable-*.png
