          } finally { $fixtureDigest.Dispose() }
          [ordered]@{
            scope = 'Targeted popup diagnostics only; not a full build or release acceptance'
            sourceRun = if ($current) { 40572666385 } else { 40475539423 }
            applicationSource = if ($current) { '295a0ce45296d4310ee1b6a7c8e536b5911e1625' } else { 'c1338ba5a6f557b5f9245d7316775c5dd20310f0' }
