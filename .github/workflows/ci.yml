name: Build and test
on:
  push:
    branches: [diag/028-browser-html]
permissions:
  contents: read
  actions: read
jobs:
  windows-browser-diagnostics:
    name: Actual browser selection against retained exact release application
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Download exact retained project evidence without rebuilding
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const path = require('node:path');
            const owner='Blueeeecho', repo='EchoLingo';
            const {data: run} = await github.rest.actions.getWorkflowRun({owner,repo,run_id:41294704154});
            if (run.head_sha !== '501a0c5d7d8e709da27feaae26fddf29980adaab') throw Error('Original source mismatch');
            const {data: a} = await github.rest.actions.getArtifact({owner,repo,artifact_id:13079232246});
            const hash='83b996cc1f1d1af77f18b5205b2bee2bbb8a06f8f9d2a895c3b5fda01cd6c8e9';
            if (a.expired || a.workflow_run.id !== 41294704154 || a.size_in_bytes !== 19035760 || a.digest !== `sha256:${hash}`) throw Error('Retained evidence identity mismatch');
            const {data} = await github.rest.actions.downloadArtifact({owner,repo,artifact_id:13079232246,archive_format:'zip'});
            const bytes=Buffer.from(data);
            if (bytes.length !== 19035760 || crypto.createHash('sha256').update(bytes).digest('hex') !== hash) throw Error('Evidence bytes mismatch');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'retained-evidence.zip'), bytes);
      - name: Extract only the exact regular built executable
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          member='EchoLingo/EchoLingo/src-tauri/target/release/echolingo.exe'
          expected='bc36f6ee1037bdf6ff7f2b55d054518eb8bfaea5a8f2831ee1e236d5eaa6d493'
          with zipfile.ZipFile(root/'retained-evidence.zip') as archive:
              entries=[x for x in archive.infolist() if x.filename==member]
              assert len(entries)==1
              entry=entries[0]; mode=entry.external_attr>>16
              assert not entry.is_dir() and not stat.S_ISLNK(mode) and (stat.S_IFMT(mode) in (0,stat.S_IFREG)) and entry.file_size==8328704
              with archive.open(entry) as stream: data=stream.read(8328705)
              assert len(data)==8328704 and hashlib.sha256(data).hexdigest()==expected
          (root/'retained-echolingo.exe').write_bytes(data)
          (root/'retained-app-identity.json').write_text(json.dumps({'source':'501a0c5d7d8e709da27feaae26fddf29980adaab','originalRun':41294704154,'artifact':13079232246,'applicationSha256':expected,'applicationBytes':len(data),'diagnosticOnly':True,'formalReleaseAcceptance':False}),encoding='utf-8')
          PY
      - name: Original real browser matrix with failure-format diagnostic only
        id: browser
        continue-on-error: true
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          $output = @(& node tests/windows-browser-selection-smoke.mjs --application "$env:RUNNER_TEMP/retained-echolingo.exe" --expected-application-sha256 bc36f6ee1037bdf6ff7f2b55d054518eb8bfaea5a8f2831ee1e236d5eaa6d493 --expected-application-bytes 8328704 --selection-suite same-page-mouse --browser-order edge-first --shortcut-gesture paced 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-browser-selection.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-028-retained-browser-HTML-diagnostic
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/echolingo-browser-selection.log
            ${{ runner.temp }}/retained-app-identity.json
      - name: Gate original browser verdict without replacing release acceptance
        if: always()
        shell: powershell
        run: |
          if ('${{ steps.browser.outcome }}' -ne 'success') { throw 'Original browser matrix failed or was not completed; failure-format diagnostics do not change its verdict.' }
