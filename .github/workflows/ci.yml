          $output | Out-File "$env:RUNNER_TEMP/echolingo-selection-winforms.log" -Encoding utf8
          $output | Write-Output
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-nonbrowser-mouse
          if-no-files-found: warn
          path: ${{ runner.temp }}/echolingo-selection-*.log
      - name: Gate exact non-browser outcomes without hiding inconclusive cases
        if: always()
        shell: powershell
        run: |
          $outcomes = @{ notepad='${{ steps.notepad.outcome }}'; generatedWpf='${{ steps.wpf.outcome }}'; generatedWinforms='${{ steps.winforms.outcome }}' }
          $outcomes | ConvertTo-Json -Compress
          if (@($outcomes.Values | Where-Object { $_ -ne 'success' }).Count -gt 0) { throw 'Non-browser selection incomplete or failed; read raw setup/product classifications.' }

  windows-selection-cold-edge-diagnostics:
    name: Two cold Edge first selections with own-popup diagnostics
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'windows-selection-cold-edge-diagnostics' || github.event.inputs.mode == 'windows-selection-paced-edge-diagnostics')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require immutable released application source
        shell: powershell
        run: |
          git diff --quiet 295a0ce45296d4310ee1b6a7c8e536b5911e1625 HEAD -- src src-tauri index.html package.json package-lock.json resources assets scripts .cargo
          if ($LASTEXITCODE -ne 0) { throw 'Production changed; rebuild instead of claiming released-binary acceptance.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          run-id: '40572666385'
          github-token: ${{ github.token }}
          path: selection-browser-app-candidate
      - name: Verify exact released stage executable
        id: candidate
        shell: powershell
        run: |
          $files = @(Get-ChildItem selection-browser-app-candidate -Recurse -File -Filter echolingo.exe)
          if ($files.Count -ne 1) { throw 'Expected one exact stage executable.' }
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($files[0].Length -ne 5825536 -or $hash -ne '8490a973c9e4f4568b851f61524a4ef8f554d8b3a506b12dd19ba34f0dd22a4b') { throw 'Released application identity mismatch.' }
          "path=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          [ordered]@{ applicationSource='295a0ce45296d4310ee1b6a7c8e536b5911e1625'; sourceRun=40572666385; stageBytes=$files[0].Length; stageSha256=$hash; fixtureCommit='${{ github.sha }}'; browserOrder='edge-first' } | ConvertTo-Json -Compress
      - name: Mouse release then actual single registered Alt+D
        id: selection
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          $output = @(& node tests/windows-browser-selection-smoke.mjs --selection-suite same-page-mouse --cold-edge-cases 2 --shortcut-gesture '${{ github.event.inputs.mode == 'windows-selection-paced-edge-diagnostics' && 'paced' || 'instant' }}' --browser-order 'edge-first' --application '${{ steps.candidate.outputs.path }}' --expected-application-sha256 8490a973c9e4f4568b851f61524a4ef8f554d8b3a506b12dd19ba34f0dd22a4b --expected-application-bytes 5825536 2>&1)
          $code = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-browser-app-selection.log" -Encoding utf8
          $output | Write-Output
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-cold-edge
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/echolingo-browser-app-selection.log
            ${{ runner.temp }}/echolingo-browser-app-diagnostics-*/*
      - name: Gate exact application browser chain
        if: always()
        shell: powershell
        run: |
          $outcome = '${{ steps.selection.outcome }}'
          [ordered]@{ scope='Released295 application; actual mouse then single Alt+D; generated browser pages only'; selection=$outcome; physicalWindows11Tested=$false; wpsTested=$false } | ConvertTo-Json -Compress
          if ($outcome -ne 'success') { throw 'Actual browser registered-Alt+D chain incomplete or failed.' }

