name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Full regression or exact-binary desktop diagnostics
        type: choice
        default: full
        options: [full, windows-popup-diagnostics, windows-application-diagnostics, windows-input-plane-experiment, windows-native-diagnostics, windows-shortcuts-ui-diagnostics]
permissions:
  contents: read
jobs:
  desktop:
    if: github.event.inputs.mode != 'windows-popup-diagnostics' && github.event.inputs.mode != 'windows-application-diagnostics' && github.event.inputs.mode != 'windows-input-plane-experiment' && github.event.inputs.mode != 'windows-native-diagnostics' && github.event.inputs.mode != 'windows-shortcuts-ui-diagnostics'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Offline model staging integrity fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test_prepare_offline_models.py
      - name: Windows native C++ compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Windows offline model download cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/echolingo-offline-model-cache
          key: ${{ runner.os }}-offline-models-${{ hashFiles('resources/offline-translation/manifest.json') }}
      - name: Windows offline isolation prerequisites (read-only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $state = [ordered]@{ readOnly = $true }
          try {
            $state.firewallServiceStatus = [string](Get-Service MpsSvc -ErrorAction Stop).Status
            $state.connections = @(Get-NetConnectionProfile -ErrorAction Stop | Select-Object NetworkCategory, IPv4Connectivity, IPv6Connectivity)
            $state.effectiveProfiles = @(Get-NetFirewallProfile -PolicyStore ActiveStore -ErrorAction Stop | Select-Object Name, Enabled)
          } catch { $state.readError = $_.Exception.Message }
          $state | ConvertTo-Json -Depth 5 -Compress
      - name: Prepare verified offline English-Chinese models
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python scripts/prepare-offline-models.py --cache "$env:RUNNER_TEMP/echolingo-offline-model-cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-offline-models.py --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned native offline translation engine
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          ninja --version
          python scripts/offline-engine/build.py --work-dir "$env:RUNNER_TEMP/echolingo-offline-engine-build" --output-dir resources/offline-translation/bin --jobs 4 --generator Ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package corresponding offline inference source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-offline-source.py --engine-work-dir "$env:RUNNER_TEMP/echolingo-offline-engine-build" --output "$env:RUNNER_TEMP/EchoLingo-offline-engine-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit exact Windows runtime resource allowlist
        if: runner.os == 'Windows'
        run: python scripts/audit-windows-resources.py --staged
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Native Windows OCR self-test (real WinRT fixture)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File src-tauri/native/windows.ps1 -Mode self-test
      - name: Windows transparent selector state regression
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-smoke.ps1 -CaptureStateOnly
      - name: macOS native toolchain versions
        if: runner.os == 'macOS'
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          xcrun --show-sdk-version
      - name: Native macOS OCR and private pasteboard self-test
        if: runner.os == 'macOS'
        run: bash tests/macos-native-self-test.sh
      - name: Windows selected-text and clipboard desktop smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-smoke.ps1
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build desktop installer
        run: npm run tauri build -- --bundles ${{ runner.os == 'Windows' && 'nsis' || 'dmg' }}
      - name: Identify the actual embedded precompiled Windows helper
        id: windows_native_candidate
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $dll = Get-ChildItem src-tauri/target/release/build -Recurse -File -Filter echolingo-windows-native.dll | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $dll) { throw 'The production Windows native DLL was not built.' }
          $appBytes = [IO.File]::ReadAllBytes((Resolve-Path src-tauri/target/release/echolingo.exe))
          $dllBytes = [IO.File]::ReadAllBytes($dll.FullName)
          Add-Type -TypeDefinition @'
          public static class EchoLingoExactPayload {
            public static int Find(byte[] binary, byte[] payload) {
              if (payload.Length == 0) return -1;
              for (int i = 0; i <= binary.Length - payload.Length; i++) {
                if (binary[i] != payload[0]) continue;
                int j = 1; while (j < payload.Length && binary[i+j] == payload[j]) j++;
                if (j == payload.Length) return i;
              }
              return -1;
            }
          }
          '@
          $payloadOffset = [EchoLingoExactPayload]::Find($appBytes, $dllBytes)
          if ($payloadOffset -lt 0) { throw 'The selected complete DLL is not embedded byte-for-byte in the actual application.' }
          "path=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          [ordered]@{ dllBytes = $dllBytes.Length; dllSha256 = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); completePayloadEmbedded = $true; exactPayloadOffset = $payloadOffset } | ConvertTo-Json -Compress
      - name: Windows real shortcut conflict CLI probe
        id: windows_shortcut_install
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        run: |
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-shortcut-install-smoke.ps1 -ApplicationPath src-tauri/target/release/echolingo.exe -IsolatedTestSession 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-shortcut-install.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - name: Windows native assembly load and fail-closed checks
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-assembly-smoke.ps1 -NativeAssemblyPath '${{ steps.windows_native_candidate.outputs.path }}'
      - name: Actual packaged Windows shortcut settings and registered-key recording
        id: windows_shortcuts_ui
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 4
        shell: powershell
        run: |
          # Windows PowerShell's default Stop preference aborts on native
          # stderr before the captured output can be saved. Keep the actual
          # Node exit code and preserve every diagnostic line in finally.
          $ErrorActionPreference = 'Continue'
          $output = @(); $fixtureExit = 1
          $global:LASTEXITCODE = 1 # A missing/unlaunchable node must never reuse a null/success exit code.
          try {
            $output = @(node tests/windows-shortcuts-ui.mjs src-tauri/target/release/echolingo.exe --isolated-test-session 2>&1)
            $fixtureExit = $LASTEXITCODE
          } finally {
            $output | Out-File "$env:RUNNER_TEMP/echolingo-shortcuts-ui.log" -Encoding utf8
            $output | Write-Output
          }
          exit $fixtureExit
      - name: Windows live transparent region selector desktop smoke
        id: windows_live_capture
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-live-capture-smoke.ps1 -NativeAssemblyPath '${{ steps.windows_native_candidate.outputs.path }}'
      - name: Same-runner actual helper startup and drag A-B measurements
        id: windows_helper_performance
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 6
        shell: powershell
        run: |
          git fetch --no-tags --depth=1 origin ab4405cc15e2ca204459b2fd40389924aa994695
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $baseline = "$env:RUNNER_TEMP/echolingo-ab4405c-windows.ps1"
          git show ab4405cc15e2ca204459b2fd40389924aa994695:src-tauri/native/windows.ps1 | Out-File $baseline -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-helper-performance-smoke.ps1 -BaselineHelperPath $baseline -NativeAssemblyPath '${{ steps.windows_native_candidate.outputs.path }}' 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-helper-performance.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - name: Windows application shortcut and OCR integration smoke
        id: windows_application_core
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-application-smoke.ps1 -ApplicationPath src-tauri/target/release/echolingo.exe
      - name: Windows popup outside-click and focus integration smoke
        id: windows_popup_visibility
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-popup-visibility-smoke.ps1 -ApplicationPath src-tauri/target/release/echolingo.exe -IsolatedTestSession
      - name: Windows installed NSIS real offline-model acceptance
        id: windows_installed_offline
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 25
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/windows-offline-translation-test.ps1
      - name: Preserve offline acceptance and corresponding source evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/echolingo-offline-validation.json
            ${{ runner.temp }}/echolingo-shortcut-install.log
            ${{ runner.temp }}/echolingo-shortcuts-ui.log
            ${{ runner.temp }}/echolingo-helper-performance.log
            ${{ runner.temp }}/EchoLingo-offline-engine-source.zip
            resources/offline-translation/manifest.json
            src-tauri/target/release/echolingo.exe
            ${{ runner.temp }}/echolingo-offline-engine-build/build-windows/CMakeCache.txt
            ${{ runner.temp }}/echolingo-offline-engine-build/build-windows/build.ninja
      # Preserve built candidates even when a later acceptance fixture fails.
      # An uploaded bundle does not change the job's acceptance/release status.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
      # Collect independent desktop results and preserve the candidate even if
      # one fixture fails; the job still fails unless every acceptance passes.
      - name: Gate Windows desktop acceptance
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $taskOutcomes = @{
            liveCapture = '${{ steps.windows_live_capture.outcome }}'
            applicationCore = '${{ steps.windows_application_core.outcome }}'
            popupVisibility = '${{ steps.windows_popup_visibility.outcome }}'
            installedOffline = '${{ steps.windows_installed_offline.outcome }}'
            shortcutInstall = '${{ steps.windows_shortcut_install.outcome }}'
            shortcutsUi = '${{ steps.windows_shortcuts_ui.outcome }}'
            helperPerformance = '${{ steps.windows_helper_performance.outcome }}'
          }
          $taskOutcomes | ConvertTo-Json -Compress
          if (@($taskOutcomes.Values | Where-Object { $_ -ne 'success' }).Count -gt 0) {
            throw 'Windows desktop acceptance incomplete or failed; preview artifacts are not a passing release.'
          }

  frontend-interactions:
    if: github.event.inputs.mode != 'windows-popup-diagnostics' && github.event.inputs.mode != 'windows-application-diagnostics' && github.event.inputs.mode != 'windows-input-plane-experiment' && github.event.inputs.mode != 'windows-native-diagnostics' && github.event.inputs.mode != 'windows-shortcuts-ui-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview installer safety and rollback fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: npm ci
      - name: Reuse the runner browser, download Chromium only if absent
        timeout-minutes: 10
        run: |
          task_browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$task_browser" ]; then
            echo "ECHOLINGO_TEST_CHROMIUM=$task_browser" >> "$GITHUB_ENV"
            "$task_browser" --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Isolated UI / IPC regression tests
        run: |
          npm run dev > "$RUNNER_TEMP/echolingo-vite.log" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -s http://127.0.0.1:1420/ > /dev/null
          npm run test:ui

  windows-popup-diagnostics:
    name: Targeted popup diagnostics (reused c133 binary)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'windows-popup-diagnostics'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged application source
        shell: powershell
        run: |
          git diff --quiet c1338ba5a6f557b5f9245d7316775c5dd20310f0 HEAD -- src src-tauri index.html package.json package-lock.json resources
          if ($LASTEXITCODE -ne 0) { throw 'Application changed; use the full build instead of the reused binary.' }
      - uses: actions/download-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          run-id: 40475539423
          github-token: ${{ github.token }}
          path: popup-candidate-evidence
      - name: Verify exact previously built application
        id: candidate
        shell: powershell
        run: |
          $candidateFiles = @(Get-ChildItem popup-candidate-evidence -Recurse -File -Filter echolingo.exe)
          if ($candidateFiles.Count -ne 1) { throw 'Expected exactly one staged candidate executable.' }
          $candidatePath = $candidateFiles[0].FullName
          $candidateHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candidateHash -ne '97d461e75a83fb3e71dcde3feddfb1dbc2ea5f27ff63dc572bfc7292fedc667e') { throw 'Candidate identity mismatch.' }
          # Windows checkout can convert LF to CRLF. Preserve the exact file
          # digest and an explicit LF digest for comparison with Git snapshots.
          $fixtureText = [IO.File]::ReadAllText((Resolve-Path tests/windows-popup-visibility-smoke.ps1)).Replace("`r`n", "`n")
          $fixtureDigest = [Security.Cryptography.SHA256]::Create()
          try {
            $fixtureLfHash = [BitConverter]::ToString($fixtureDigest.ComputeHash([Text.UTF8Encoding]::new($false).GetBytes($fixtureText))).Replace('-', '').ToLowerInvariant()
          } finally { $fixtureDigest.Dispose() }
          [ordered]@{
            scope = 'Targeted popup diagnostics only; not a full build or release acceptance'
            sourceRun = 40475539423
            applicationSource = 'c1338ba5a6f557b5f9245d7316775c5dd20310f0'
            stagedSha256 = $candidateHash
            checkoutFixtureSha256 = (Get-FileHash tests/windows-popup-visibility-smoke.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
            canonicalLfFixtureSha256 = $fixtureLfHash
          } | ConvertTo-Json -Compress
          "path=$candidatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run actual popup interactions against verified candidate
        id: popup
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        env:
          ECHOLINGO_POPUP_CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          $fixtureOutput = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-popup-visibility-smoke.ps1 -ApplicationPath $env:ECHOLINGO_POPUP_CANDIDATE -IsolatedTestSession 2>&1)
          $fixtureExit = $LASTEXITCODE
          $fixtureOutput | Out-File -FilePath "$env:RUNNER_TEMP/echolingo-popup-diagnostics.log" -Encoding utf8
          $fixtureOutput | Write-Output
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-popup-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/echolingo-popup-diagnostics.log
      - name: Gate targeted popup diagnostics
        if: always()
        shell: powershell
        run: |
          $popupOutcome = '${{ steps.popup.outcome }}'
          [ordered]@{ scope = 'targeted-popup-only'; popupVisibility = $popupOutcome } | ConvertTo-Json -Compress
          if ($popupOutcome -ne 'success') { throw 'Targeted popup diagnostics incomplete or failed.' }

  windows-application-diagnostics:
    name: Targeted application diagnostics (reused ab4405c binary)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'windows-application-diagnostics'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged hover candidate application source
        shell: powershell
        run: |
          git diff --quiet ab4405cc15e2ca204459b2fd40389924aa994695 HEAD -- src src-tauri index.html package.json package-lock.json resources
          if ($LASTEXITCODE -ne 0) { throw 'Application changed; use the full build instead of the reused binary.' }
      - uses: actions/download-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          run-id: 40481264703
          github-token: ${{ github.token }}
          path: application-candidate-evidence
      - name: Verify exact previously built hover application
        id: candidate
        shell: powershell
        run: |
          $candidateFiles = @(Get-ChildItem application-candidate-evidence -Recurse -File -Filter echolingo.exe)
          if ($candidateFiles.Count -ne 1) { throw 'Expected exactly one staged candidate executable.' }
          $candidatePath = $candidateFiles[0].FullName
          $candidateHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candidateHash -ne '199d3f29c2d44fb64fa4960a6b62d61ade4bff5cec685828a6602be19c070007') { throw 'Candidate identity mismatch.' }
          $fixtureText = [IO.File]::ReadAllText((Resolve-Path tests/windows-application-smoke.ps1)).Replace("`r`n", "`n")
          $fixtureDigest = [Security.Cryptography.SHA256]::Create()
          try {
            $fixtureLfHash = [BitConverter]::ToString($fixtureDigest.ComputeHash([Text.UTF8Encoding]::new($false).GetBytes($fixtureText))).Replace('-', '').ToLowerInvariant()
          } finally { $fixtureDigest.Dispose() }
          [ordered]@{
            scope = 'Targeted actual application workflows only; no rebuild or full-run success claim'
            sourceRun = 40481264703
            applicationSource = 'ab4405cc15e2ca204459b2fd40389924aa994695'
            stagedSha256 = $candidateHash
            checkoutFixtureSha256 = (Get-FileHash tests/windows-application-smoke.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
            canonicalLfFixtureSha256 = $fixtureLfHash
          } | ConvertTo-Json -Compress
          "path=$candidatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run actual selection input and OCR workflows against verified candidate
        id: application
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        env:
          ECHOLINGO_APPLICATION_CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          $fixtureOutput = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-application-smoke.ps1 -ApplicationPath $env:ECHOLINGO_APPLICATION_CANDIDATE 2>&1)
          $fixtureExit = $LASTEXITCODE
          $fixtureOutput | Out-File -FilePath "$env:RUNNER_TEMP/echolingo-application-diagnostics.log" -Encoding utf8
          $fixtureOutput | Write-Output
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-application-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/echolingo-application-diagnostics.log
      - name: Gate targeted application diagnostics
        if: always()
        shell: powershell
        run: |
          $applicationOutcome = '${{ steps.application.outcome }}'
          [ordered]@{ scope = 'targeted-application-only'; applicationCore = $applicationOutcome } | ConvertTo-Json -Compress
          if ($applicationOutcome -ne 'success') { throw 'Targeted application diagnostics incomplete or failed.' }

  windows-input-plane-experiment:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'windows-input-plane-experiment'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generated ordinary-window transparent input ownership experiment
        id: experiment
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-input-plane-experiment.ps1 -IsolatedTestSession 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-input-plane-experiment.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-input-plane-experiment
          if-no-files-found: warn
          path: ${{ runner.temp }}/echolingo-input-plane-experiment.log
      - name: Gate experiment outcome without declaring product acceptance
        if: always()
        shell: powershell
        run: |
          $outcome = '${{ steps.experiment.outcome }}'
          [ordered]@{ scope = 'Standalone input-plane feasibility only; no production app acceptance'; outcome = $outcome } | ConvertTo-Json -Compress
          if ($outcome -ne 'success') { throw 'Transparent input-plane experiment did not pass.' }

  windows-native-diagnostics:
    name: Windows native helper diagnostics (fresh Framework DLL)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'windows-native-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact native helper without the app or offline engine
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/build-windows-native-helper.ps1 -HelperPath src-tauri/native/windows.ps1 -OutputPath "$env:RUNNER_TEMP/echolingo-native-diagnostics.dll"
      - name: Actual WinRT OCR and paragraph geometry regression
        id: ocr
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File src-tauri/native/windows.ps1 -Mode self-test -NativeAssemblyPath "$env:RUNNER_TEMP/echolingo-native-diagnostics.dll" 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-native-ocr-diagnostics.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - name: Actual DLL load and invalid-assembly failure checks
        id: assembly
        continue-on-error: true
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-assembly-smoke.ps1 -NativeAssemblyPath "$env:RUNNER_TEMP/echolingo-native-diagnostics.dll"
      - name: Actual generated-window capture and input ownership
        id: live
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $fixtureExit = 0
          foreach ($backend in @('hybrid', 'planeOnly')) {
            $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-live-capture-smoke.ps1 -NativeAssemblyPath "$env:RUNNER_TEMP/echolingo-native-diagnostics.dll" -InputBackend $backend 2>&1)
            $backendExit = $LASTEXITCODE
            $output | Out-File "$env:RUNNER_TEMP/echolingo-native-live-$backend.log" -Encoding utf8
            $output | Write-Output
            if ($backendExit -ne 0) { $fixtureExit = $backendExit }
          }
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-native-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/echolingo-native-ocr-diagnostics.log
            ${{ runner.temp }}/echolingo-native-live-*.log
      - name: Gate raw native outcomes
        if: always()
        shell: powershell
        run: |
          $outcomes = @{ ocr = '${{ steps.ocr.outcome }}'; assembly = '${{ steps.assembly.outcome }}'; live = '${{ steps.live.outcome }}' }
          $outcomes | ConvertTo-Json -Compress
          if (@($outcomes.Values | Where-Object { $_ -ne 'success' }).Count -gt 0) { throw 'Fresh native Windows checks failed or incomplete; this is not app acceptance.' }

  windows-shortcuts-ui-diagnostics:
    name: Targeted shortcut UI diagnostics (exact 0a08830 binary)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'windows-shortcuts-ui-diagnostics'
    runs-on: windows-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged exact packaged application source
        shell: powershell
        run: |
          git diff --quiet 0a08830f8286a2d54aa658c8876b013a8b1696b1 HEAD -- src src-tauri resources assets scripts index.html package.json package-lock.json vite.config.ts tsconfig.json tsconfig.node.json .cargo
          if ($LASTEXITCODE -ne 0) { throw 'Application source changed; the 0a08830 binary cannot prove this checkout.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12734022372'
          run-id: 40502410316
          github-token: ${{ github.token }}
          path: shortcut-candidate-evidence
          merge-multiple: true
      - name: Verify exact previously built stage executable
        id: candidate
        shell: powershell
        run: |
          $candidateFiles = @(Get-ChildItem shortcut-candidate-evidence -Recurse -File -Filter echolingo.exe)
          if ($candidateFiles.Count -ne 1) { throw 'Expected exactly one stage executable in the exact source-run artifact.' }
          $candidatePath = $candidateFiles[0].FullName
          $candidateHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candidateFiles[0].Length -ne 5717504 -or $candidateHash -ne '046a33fd4498e7ef2e14a49f694f0a1fa9e6e2af1805d1538358e8bcfce77090') { throw 'Exact stage executable identity mismatch.' }
          $identity = [ordered]@{
            scope = 'Targeted actual shortcut UI only; no rebuild or full-run success claim'
            sourceRun = 40502410316
            sourceArtifactId = 12734022372
            applicationSource = '0a08830f8286a2d54aa658c8876b013a8b1696b1'
            sourceArtifactApiDigest = 'sha256:74145ae5b69cb755124cc2e565cc9d287206f435b20b5d830c4c0ffd7c5dd33d'
            stagedBytes = $candidateFiles[0].Length
            stagedSha256 = $candidateHash
            checkoutFixtureSha256 = (Get-FileHash tests/windows-shortcuts-ui.mjs -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $identity | ConvertTo-Json -Compress | Tee-Object -FilePath "$env:RUNNER_TEMP/echolingo-shortcuts-ui-identity.json"
          "path=$candidatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run original actual shortcut UI interactions with bounded diagnostics
        id: shortcuts_ui
        continue-on-error: true
        timeout-minutes: 4
        shell: powershell
        env:
          ECHOLINGO_SHORTCUT_UI_CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(); $fixtureExit = 1
          $global:LASTEXITCODE = 1 # A missing/unlaunchable node must never reuse a null/success exit code.
          try {
            $output = @(node tests/windows-shortcuts-ui.mjs $env:ECHOLINGO_SHORTCUT_UI_CANDIDATE --isolated-test-session 2>&1)
            $fixtureExit = $LASTEXITCODE
          } finally {
            $output | Out-File "$env:RUNNER_TEMP/echolingo-shortcuts-ui.log" -Encoding utf8
            $output | Write-Output
          }
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-shortcuts-ui-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/echolingo-shortcuts-ui.log
            ${{ runner.temp }}/echolingo-shortcuts-ui-identity.json
      - name: Gate targeted shortcut UI raw outcome
        if: always()
        shell: powershell
        run: |
          $outcome = '${{ steps.shortcuts_ui.outcome }}'
          [ordered]@{ scope = 'targeted-shortcut-ui-only'; shortcutUi = $outcome } | ConvertTo-Json -Compress
          if ($outcome -ne 'success') { throw 'Targeted actual shortcut UI diagnostics incomplete or failed.' }
