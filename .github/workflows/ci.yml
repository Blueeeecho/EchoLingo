          path: ${{ runner.temp }}/echolingo-selection-clipboard-race.log
      - name: Gate clipboard race outcome
        if: always()
        shell: powershell
        run: |
          $outcome = '${{ steps.race.outcome }}'
          [ordered]@{ scope = 'Actual production helper against generated same-source clipboard publications'; race = $outcome } | ConvertTo-Json -Compress
          if ($outcome -ne 'success') { throw 'Clipboard race behavior failed or was inconclusive.' }
