name: Build and test
on:
  push:
    branches: [diag/028-clipboard-comparison]
permissions:
  contents: read
jobs:
  windows-native-diagnostics:
    name: Windows native helper diagnostics (generated clipboard publication comparison only)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile exact native helper without the app or offline engine
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/build-windows-native-helper.ps1 -HelperPath src-tauri/native/windows.ps1 -OutputPath "$env:RUNNER_TEMP/echolingo-native-diagnostics.dll"
      - name: Compare generated clipboard publication without changing original acceptance
        id: comparison
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          git rev-parse HEAD | Out-File "$env:RUNNER_TEMP/echolingo-clipboard-comparison-source.txt" -Encoding utf8
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-smoke.ps1 -ClipboardPublicationComparison 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-clipboard-publication-comparison.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-028-clipboard-publication-comparison
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/echolingo-clipboard-comparison-source.txt
            ${{ runner.temp }}/echolingo-clipboard-publication-comparison.log
