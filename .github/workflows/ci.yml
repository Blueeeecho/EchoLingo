name: Build and test
on:
  push:
    branches: [diag/028-mac-oracle]
permissions:
  contents: read
jobs:
  macos-screenshot-native-probe:
    name: macOS native screenshot capture (permission block is not a pass)
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise generated native images, dialogs and production capture
        id: macos_f1_native_probe
        continue-on-error: true
        shell: bash
        run: bash tests/macos-screenshot-native-fixture.sh "$RUNNER_TEMP/macos-f1-native-probe" --isolated-test-session
      - name: Preserve native capture provenance and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-F1-native-probe
          path: ${{ runner.temp }}/macos-f1-native-probe
          if-no-files-found: error
      - name: Require actual native capture pass, not blocked permissions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'Native capture probe outcome: ${{ steps.macos_f1_native_probe.outcome }}. This is not physical F1 or packaged editor acceptance. Permission-blocked capture remains a failed gate; no security settings are changed.' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/verify-macos-screenshot-probe.py "$RUNNER_TEMP/macos-f1-native-probe/report.json" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
