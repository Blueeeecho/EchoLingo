name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Full regression or targeted popup diagnostics using the exact 47eb candidate
        type: choice
        default: full
        options: [full, windows-popup-diagnostics]
permissions:
  contents: read
jobs:
  desktop:
    if: github.event.inputs.mode != 'windows-popup-diagnostics'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Offline model staging integrity fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test_prepare_offline_models.py
      - name: Windows native C++ compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Windows offline model download cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/echolingo-offline-model-cache
          key: ${{ runner.os }}-offline-models-${{ hashFiles('resources/offline-translation/manifest.json') }}
      - name: Windows offline isolation prerequisites (read-only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $state = [ordered]@{ readOnly = $true }
          try {
            $state.firewallServiceStatus = [string](Get-Service MpsSvc -ErrorAction Stop).Status
            $state.connections = @(Get-NetConnectionProfile -ErrorAction Stop | Select-Object NetworkCategory, IPv4Connectivity, IPv6Connectivity)
            $state.effectiveProfiles = @(Get-NetFirewallProfile -PolicyStore ActiveStore -ErrorAction Stop | Select-Object Name, Enabled)
          } catch { $state.readError = $_.Exception.Message }
          $state | ConvertTo-Json -Depth 5 -Compress
      - name: Prepare verified offline English-Chinese models
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python scripts/prepare-offline-models.py --cache "$env:RUNNER_TEMP/echolingo-offline-model-cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-offline-models.py --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned native offline translation engine
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          ninja --version
          python scripts/offline-engine/build.py --work-dir "$env:RUNNER_TEMP/echolingo-offline-engine-build" --output-dir resources/offline-translation/bin --jobs 4 --generator Ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package corresponding offline inference source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-offline-source.py --engine-work-dir "$env:RUNNER_TEMP/echolingo-offline-engine-build" --output "$env:RUNNER_TEMP/EchoLingo-offline-engine-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Native Windows OCR self-test (real WinRT fixture)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File src-tauri/native/windows.ps1 -Mode self-test
      - name: Windows transparent selector state regression
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-smoke.ps1 -CaptureStateOnly
      - name: macOS native toolchain versions
        if: runner.os == 'macOS'
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version
          xcrun --show-sdk-version
      - name: Native macOS OCR and private pasteboard self-test
        if: runner.os == 'macOS'
        run: bash tests/macos-native-self-test.sh
      - name: Windows selected-text and clipboard desktop smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-smoke.ps1
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build desktop installer
        run: npm run tauri build -- --bundles ${{ runner.os == 'Windows' && 'nsis' || 'dmg' }}
      - name: Windows live transparent region selector desktop smoke
        id: windows_live_capture
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-live-capture-smoke.ps1
      - name: Windows application shortcut and OCR integration smoke
        id: windows_application_core
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-application-smoke.ps1 -ApplicationPath src-tauri/target/release/echolingo.exe
      - name: Windows popup outside-click and focus integration smoke
        id: windows_popup_visibility
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-popup-visibility-smoke.ps1 -ApplicationPath src-tauri/target/release/echolingo.exe -IsolatedTestSession
      - name: Windows installed NSIS real offline-model acceptance
        id: windows_installed_offline
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 25
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/windows-offline-translation-test.ps1
      - name: Preserve offline acceptance and corresponding source evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/echolingo-offline-validation.json
            ${{ runner.temp }}/EchoLingo-offline-engine-source.zip
            resources/offline-translation/manifest.json
            src-tauri/target/release/echolingo.exe
            ${{ runner.temp }}/echolingo-offline-engine-build/build-windows/CMakeCache.txt
            ${{ runner.temp }}/echolingo-offline-engine-build/build-windows/build.ninja
      # Preserve built candidates even when a later acceptance fixture fails.
      # An uploaded bundle does not change the job's acceptance/release status.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
      # Collect independent desktop results and preserve the candidate even if
      # one fixture fails; the job still fails unless every acceptance passes.
      - name: Gate Windows desktop acceptance
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $taskOutcomes = @{
            liveCapture = '${{ steps.windows_live_capture.outcome }}'
            applicationCore = '${{ steps.windows_application_core.outcome }}'
            popupVisibility = '${{ steps.windows_popup_visibility.outcome }}'
            installedOffline = '${{ steps.windows_installed_offline.outcome }}'
          }
          $taskOutcomes | ConvertTo-Json -Compress
          if (@($taskOutcomes.Values | Where-Object { $_ -ne 'success' }).Count -gt 0) {
            throw 'Windows desktop acceptance incomplete or failed; preview artifacts are not a passing release.'
          }

  frontend-interactions:
    if: github.event.inputs.mode != 'windows-popup-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview installer safety and rollback fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Isolated UI / IPC regression tests
        run: |
          npm run dev > "$RUNNER_TEMP/echolingo-vite.log" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 -s http://127.0.0.1:1420/ > /dev/null
          npm run test:ui

  windows-popup-diagnostics:
    name: Targeted popup diagnostics (reused 47eb binary)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'windows-popup-diagnostics'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require unchanged application source
        shell: powershell
        run: |
          git diff --quiet 47eb30ae4093637f23de921a68599024620ae88f HEAD -- src src-tauri index.html package.json package-lock.json resources
          if ($LASTEXITCODE -ne 0) { throw 'Application changed; use the full build instead of the reused binary.' }
      - uses: actions/download-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          run-id: 40470704055
          github-token: ${{ github.token }}
          path: popup-candidate-evidence
      - name: Verify exact previously built application
        id: candidate
        shell: powershell
        run: |
          $candidateFiles = @(Get-ChildItem popup-candidate-evidence -Recurse -File -Filter echolingo.exe)
          if ($candidateFiles.Count -ne 1) { throw 'Expected exactly one staged candidate executable.' }
          $candidatePath = $candidateFiles[0].FullName
          $candidateHash = (Get-FileHash -LiteralPath $candidatePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candidateHash -ne 'b9924c182cc55eed10bccd396f0f9fc035ae15700b97bc3348996595478a0c08') { throw 'Candidate identity mismatch.' }
          # Windows checkout can convert LF to CRLF. Preserve the exact file
          # digest and an explicit LF digest for comparison with Git snapshots.
          $fixtureText = [IO.File]::ReadAllText((Resolve-Path tests/windows-popup-visibility-smoke.ps1)).Replace("`r`n", "`n")
          $fixtureDigest = [Security.Cryptography.SHA256]::Create()
          try {
            $fixtureLfHash = [BitConverter]::ToString($fixtureDigest.ComputeHash([Text.UTF8Encoding]::new($false).GetBytes($fixtureText))).Replace('-', '').ToLowerInvariant()
          } finally { $fixtureDigest.Dispose() }
          [ordered]@{
            scope = 'Targeted popup diagnostics only; not a full build or release acceptance'
            sourceRun = 40470704055
            applicationSource = '47eb30ae4093637f23de921a68599024620ae88f'
            stagedSha256 = $candidateHash
            checkoutFixtureSha256 = (Get-FileHash tests/windows-popup-visibility-smoke.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
            canonicalLfFixtureSha256 = $fixtureLfHash
          } | ConvertTo-Json -Compress
          "path=$candidatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Run actual popup interactions against verified candidate
        id: popup
        continue-on-error: true
        timeout-minutes: 5
        shell: powershell
        env:
          ECHOLINGO_POPUP_CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          $fixtureOutput = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-popup-visibility-smoke.ps1 -ApplicationPath $env:ECHOLINGO_POPUP_CANDIDATE -IsolatedTestSession 2>&1)
          $fixtureExit = $LASTEXITCODE
          $fixtureOutput | Out-File -FilePath "$env:RUNNER_TEMP/echolingo-popup-diagnostics.log" -Encoding utf8
          $fixtureOutput | Write-Output
          exit $fixtureExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-Windows-popup-diagnostics
          if-no-files-found: warn
          path: ${{ runner.temp }}/echolingo-popup-diagnostics.log
      - name: Gate targeted popup diagnostics
        if: always()
        shell: powershell
        run: |
          $popupOutcome = '${{ steps.popup.outcome }}'
          [ordered]@{ scope = 'targeted-popup-only'; popupVisibility = $popupOutcome } | ConvertTo-Json -Compress
          if ($popupOutcome -ne 'success') { throw 'Targeted popup diagnostics incomplete or failed.' }
