name: Publish preview release
on:
  workflow_dispatch:
  push:
    tags: ['v*', '0.*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Offline model staging integrity fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test_prepare_offline_models.py
      - name: Windows native C++ compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Windows offline model download cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/echolingo-offline-model-cache
          key: ${{ runner.os }}-offline-models-${{ hashFiles('resources/offline-translation/manifest.json') }}
      - name: Windows offline isolation prerequisites (read-only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $state = [ordered]@{ readOnly = $true }
          try {
            $state.firewallServiceStatus = [string](Get-Service MpsSvc -ErrorAction Stop).Status
            $state.connections = @(Get-NetConnectionProfile -ErrorAction Stop | Select-Object NetworkCategory, IPv4Connectivity, IPv6Connectivity)
            $state.effectiveProfiles = @(Get-NetFirewallProfile -PolicyStore ActiveStore -ErrorAction Stop | Select-Object Name, Enabled)
          } catch { $state.readError = $_.Exception.Message }
          $state | ConvertTo-Json -Depth 5 -Compress
      - name: Prepare verified offline English-Chinese models
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python scripts/prepare-offline-models.py --cache "$env:RUNNER_TEMP/echolingo-offline-model-cache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare-offline-models.py --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned native offline translation engine
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          ninja --version
          python scripts/offline-engine/build.py --work-dir "$env:RUNNER_TEMP/echolingo-offline-engine-build" --output-dir resources/offline-translation/bin --jobs 4 --generator Ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package corresponding offline inference source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-offline-source.py --engine-work-dir "$env:RUNNER_TEMP/echolingo-offline-engine-build" --output "$env:RUNNER_TEMP/EchoLingo-offline-engine-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check public release inputs
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/check-repository.py
          else
            python3 scripts/check-repository.py
          fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Native macOS OCR and private pasteboard self-test
        if: runner.os == 'macOS'
        run: bash tests/macos-native-self-test.sh
      - name: Windows native self-test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File src-tauri/native/windows.ps1 -Mode self-test 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-release-native-self-test.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - name: Windows selected-text and clipboard desktop smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-smoke.ps1 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-release-native-selection.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - name: Windows exact priority keyboard and optional side-button input
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-priority-input-smoke.ps1 -OutputDirectory "$env:RUNNER_TEMP/echolingo-release-priority-input" -IsolatedTestSession 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-release-priority-input.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: EchoLingo · 回声译 __VERSION__
          releaseBody: |
            EchoLingo · 回声译 内测版 Beta2。

            选中文字后快捷翻译，或左键框选进行 OCR 并自动翻译。支持自定义快捷键、翻译服务、主题和翻译历史。

            Windows：下载并运行 x64 安装程序。
            macOS：打开 DMG，将 EchoLingo 拖入 Applications。此为未公证预览包，安装指引见 README。
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
      - name: Actual packaged Windows shortcut settings and automatic saving
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(); $fixtureExit = 1
          $global:LASTEXITCODE = 1
          try {
            $candidate = (Resolve-Path src-tauri/target/release/echolingo.exe).Path
            $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            $bytes = (Get-Item -LiteralPath $candidate).Length
            $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-shortcuts-uia-smoke.ps1 -ApplicationPath $candidate -ExpectedApplicationSha256 $hash -ExpectedApplicationBytes $bytes -IsolatedTestSession 2>&1)
            $fixtureExit = $LASTEXITCODE
          } finally {
            $output | Out-File "$env:RUNNER_TEMP/echolingo-release-shortcuts-ui.log" -Encoding utf8
            $output | Write-Output
          }
          exit $fixtureExit
      - name: Windows installed NSIS real offline-model acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 1
          $output = @(& powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/windows-offline-translation-test.ps1 2>&1)
          $fixtureExit = $LASTEXITCODE
          $output | Out-File "$env:RUNNER_TEMP/echolingo-release-installed-offline.log" -Encoding utf8
          $output | Write-Output
          exit $fixtureExit
      - name: Attach corresponding offline source to the unpublished preview
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = (Get-Content -Raw package.json | ConvertFrom-Json).version
          gh release upload $tag "$env:RUNNER_TEMP/EchoLingo-offline-engine-source.zip" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve offline acceptance and corresponding source evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/echolingo-offline-validation.json
            ${{ runner.temp }}/echolingo-release-*.log
            ${{ runner.temp }}/echolingo-priority-input-validation.json
            ${{ runner.temp }}/echolingo-release-priority-input/report.json
            ${{ runner.temp }}/EchoLingo-offline-engine-source.zip
            resources/offline-translation/manifest.json
            src-tauri/target/release/echolingo.exe
            ${{ runner.temp }}/echolingo-offline-engine-build/build-windows/CMakeCache.txt
            ${{ runner.temp }}/echolingo-offline-engine-build/build-windows/build.ninja
      - name: Preserve built preview installers on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EchoLingo-release-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
