name: Publish preview release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Windows native self-test
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File src-tauri/native/windows.ps1 -Mode self-test
      - name: Windows selected-text and clipboard desktop smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/windows-native-smoke.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: EchoLingo v__VERSION__ · Preview
          releaseBody: |
            Windows-first lightweight translation and offline OCR preview.
            Configure your own translation API in Settings. No API key is included.
            Unsigned Windows / ad-hoc signed macOS preview; no store submission or notarization.
            See docs/test-report.md for verified coverage and manual acceptance items.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
