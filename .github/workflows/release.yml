name: Publish preview release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['0.2.4']
# Build jobs retain read-only repository access. Only the final publish job writes.
permissions:
  contents: read
concurrency:
  group: echolingo-prerelease-0.2.4
  cancel-in-progress: false
jobs:
  release-inputs:
    if: github.repository == 'Blueeeecho/EchoLingo' && (github.ref == 'refs/heads/main' || github.ref == 'refs/tags/0.2.4')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the one authorized release version
        run: |
          python3 scripts/prepare-release-assets.py --check-version
          python3 scripts/check-repository.py
      - name: Refuse an existing release or a tag on another commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = '0.2.4';
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('Only the exact main release commit may be validated for publication.');
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              throw new Error('Release 0.2.4 already exists; inspect it instead of overwriting.');
            } catch (error) { if (error.status !== 404) throw error; }
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (data.object.type !== 'commit' || data.object.sha !== context.sha) {
                throw new Error('Existing release tag does not identify this exact commit.');
              }
            } catch (error) { if (error.status !== 404) throw error; }
  # Reuse every existing desktop/UI acceptance gate, not a smaller release suite.
  # Artifacts stay in this same run, so no additional actions:read scope is needed.
  verify:
    needs: release-inputs
    uses: ./.github/workflows/release-checks.yml
  publish:
    needs: [release-inputs, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EchoLingo-Windows
          path: release-inputs/EchoLingo-Windows
      - uses: actions/download-artifact@v4
        with:
          name: EchoLingo-macOS
          path: release-inputs/EchoLingo-macOS
      - uses: actions/download-artifact@v4
        with:
          name: EchoLingo-Windows-offline-evidence
          path: release-inputs/EchoLingo-Windows-offline-evidence
      - name: Verify tested bytes and prepare checksums
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/prepare-release-assets.py --artifacts release-inputs --output release-assets --commit "$RELEASE_COMMIT" --run-url "$RELEASE_RUN_URL"
      - name: Preserve verified publication inputs
        uses: actions/upload-artifact@v4
        with:
          name: EchoLingo-0.2.4-publication
          if-no-files-found: error
          path: release-assets/*
      - name: Publish a new verified prerelease without replacing existing assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            const tag = '0.2.4';
            const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            // Check again after the long build: never replace another release.
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              throw new Error('Release already exists; no files were overwritten.');
            } catch (error) { if (error.status !== 404) throw error; }
            const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.object.sha !== context.sha) throw new Error('main moved during validation; refusing stale or off-main publication.');
            try {
              const { data } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (data.object.type !== 'commit' || data.object.sha !== context.sha) throw new Error('Tag/commit mismatch.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
            }
            const directory = 'release-assets';
            const manifest = JSON.parse(fs.readFileSync(path.join(directory, 'RELEASE-MANIFEST.json'), 'utf8'));
            if (manifest.version !== tag || manifest.commit !== context.sha) throw new Error('Provenance mismatch.');
            const expectedNames = [...manifest.files.map(file => file.name), 'RELEASE-MANIFEST.json', 'SHA256SUMS.txt'].sort();
            const names = fs.readdirSync(directory).sort();
            if (JSON.stringify(names) !== JSON.stringify(expectedNames)) throw new Error('Unexpected public asset inventory.');
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync('docs/releases/0.2.4.zh-CN.md', 'utf8') + `\n\n源码提交：\`${context.sha}\`\n\n[完整构建与验收记录](${runUrl})\n`;
            const { data: release } = await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: context.sha, name: '0.2.4 内测版', body, draft: true, prerelease: true, make_latest: 'false' });
            for (const name of names) {
              const bytes = fs.readFileSync(path.join(directory, name));
              const { data: asset } = await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data: bytes });
              if (asset.state !== 'uploaded' || asset.size !== bytes.length || asset.digest !== `sha256:${sha256(bytes)}`) {
                throw new Error(`Uploaded asset verification failed: ${name}. Release remains a draft.`);
              }
            }
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id, per_page: 100 });
            if (JSON.stringify(assets.map(asset => asset.name).sort()) !== JSON.stringify(names)) throw new Error('Uploaded asset inventory mismatch.');
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.object.sha !== context.sha) throw new Error('Tag changed before publication.');
            const { data: finalMain } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (finalMain.object.sha !== context.sha) throw new Error('main moved during upload; release remains a draft.');
            const { data: published } = await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false' });
            if (published.draft || !published.prerelease || published.tag_name !== tag) throw new Error('Published release metadata mismatch.');
            await core.summary.addLink('0.2.4 内测版', published.html_url).addRaw(`\nCommit: ${context.sha}\n`).write();
