name: Build fixed 0.2.4 language-routing patch
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  patched-installers:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Require the fixed reviewed language source and unchanged baseline components
        run: |
          python scripts/verify-language-patch.py
          python scripts/prepare-release-assets.py --check-version
          python scripts/check-repository.py
      - name: Download only the immutable accepted offline-resource inputs
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const pins = [
              [13034542412, 'windows.zip', 'da42d05739744f5eafa71f9758d6a045b42020403d4228f3007d9bbda92fbb25'],
              [13034970610, 'evidence.zip', '2520b83f54d3774b75c0cc1c6fc3f3105f0c9fb380800d94ac73001e36295285']
            ];
            const directory = path.join(process.env.RUNNER_TEMP, 'language-patch-baseline');
            fs.mkdirSync(directory);
            const { data: run } = await github.rest.actions.getWorkflowRun({owner:'Blueeeecho',repo:'EchoLingo',run_id:41178655504});
            if (run.conclusion !== 'success' || run.head_sha !== '4b8c5f5ac67e07cc4005812963b2c02acdd14d5d') throw new Error('Baseline acceptance mismatch');
            for (const [id,name,hash] of pins) {
              const { data: artifact } = await github.rest.actions.getArtifact({owner:'Blueeeecho',repo:'EchoLingo',artifact_id:id});
              if (artifact.expired || artifact.workflow_run.id !== 41178655504 || artifact.digest !== `sha256:${hash}`) throw new Error('Baseline artifact provenance mismatch');
              const { data } = await github.rest.actions.downloadArtifact({owner:'Blueeeecho',repo:'EchoLingo',artifact_id:id,archive_format:'zip'});
              fs.writeFileSync(path.join(directory,name), Buffer.from(data));
            }
      - name: Stage only unchanged offline resources, never the previous application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/stage-language-patch-resources.py --windows-zip "$env:RUNNER_TEMP/language-patch-baseline/windows.zip" --evidence-zip "$env:RUNNER_TEMP/language-patch-baseline/evidence.zip" --output-dir "$env:RUNNER_TEMP/language-patch-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit-windows-resources.py --staged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      - run: npm run check
      - name: Actual platform language-routing unit tests with locked dependencies
        id: language_tests
        run: npm run test:language-routing
      - name: Require unchanged official Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build fresh patched desktop installer with locked dependencies
        run: npm run tauri build -- --bundles ${{ runner.os == 'Windows' && 'nsis' || 'dmg' }} -- --locked
      - name: Bind targeted validation to the actual new installer bytes
        shell: bash
        env:
          LANGUAGE_TARGETED_TESTS_PASSED: ${{ steps.language_tests.outcome == 'success' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            files=(src-tauri/target/release/bundle/nsis/*.exe)
            report=windows-build.json
          else
            files=(src-tauri/target/release/bundle/dmg/*.dmg)
            report=macos-build.json
          fi
          test "${#files[@]}" -eq 1
          python scripts/verify-language-patch.py --build-report "$RUNNER_TEMP/language-patch-evidence/$report" --platform "$RUNNER_OS" --installer "${files[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: EchoLingo-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EchoLingo-language-patch-${{ runner.os }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/language-patch-evidence
      - name: State reused acceptance without claiming repeated visual tests
        if: always()
        shell: bash
        run: echo 'New platform binaries and locked language-routing tests only. Unchanged native/editor/offline behavior reuses exact baseline41178655504 evidence; no new installer F1, screenshot, or visual acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
