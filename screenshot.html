<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>截图 · EchoLingo</title></head>
<body>
  <header class="editor-header"><div class="editor-brand"><span class="brand-icon">E</span><div><strong>截图</strong><small>EchoLingo · 回声译</small></div></div>
    <div class="file-actions"><button id="open-image" title="打开本地 PNG / JPEG · Ctrl/⌘ O">打开图片</button><button id="pin-image" data-image-action data-export-action title="将编辑后的图片固定在桌面，不保存或复制"><svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 8 0-1 6 4 4v2H5v-2l4-4Zm4 12v7"/></svg> 贴图</button><button id="copy-image" data-image-action data-export-action title="复制已合并的图片 · Ctrl/⌘ C">复制</button><button id="save-image" data-image-action data-export-action class="primary" title="保存到截图目录 · Ctrl/⌘ S">保存</button><button id="save-as-image" data-image-action data-export-action title="另存为 PNG · Ctrl/⌘ Shift S">另存为</button><button id="close-editor" aria-label="关闭截图编辑器">关闭</button></div>
  </header>
  <nav class="editor-toolbar" aria-label="图片编辑工具">
    <div class="tool-group" role="group" aria-label="标注工具">
      <button data-tool="select" aria-label="选择" data-image-action aria-pressed="false" title="选择 · V">⌖</button>
      <button data-tool="rectangle" aria-label="矩形" data-image-action aria-pressed="true" title="矩形 · R">▢ <span>矩形</span></button>
      <button data-tool="arrow" aria-label="箭头" data-image-action aria-pressed="false" title="箭头 · A">↗ <span>箭头</span></button>
      <button data-tool="text" aria-label="文字" data-image-action aria-pressed="false" title="文字 · T">T <span>文字</span></button>
      <button data-tool="number" aria-label="步骤" data-image-action aria-pressed="false" title="连续步骤 · N">① <span>步骤</span></button>
      <button data-tool="mosaic" aria-label="马赛克" data-image-action aria-pressed="false" title="马赛克 · M">▦ <span>马赛克</span></button>
      <button data-tool="solid" aria-label="实心遮挡" data-image-action aria-pressed="false" title="实心遮挡 · B">■ <span>实心遮挡</span></button>
      <button data-tool="crop" aria-label="裁剪" data-image-action aria-pressed="false" title="裁剪 · X">⌗ <span>裁剪</span></button>
    </div>
    <div class="tool-options"><label>颜色 <input id="edit-color" type="color" value="#e45d68" aria-label="标注颜色"/></label><label id="line-width-label">线宽 <select id="edit-width" aria-label="线宽"><option value="2">细</option><option value="4" selected>中</option><option value="8">粗</option><option value="16">特粗</option></select></label><label id="step-style-label" hidden>步骤 <select id="step-style" aria-label="步骤样式"><option value="number">序号</option><option value="numbered-arrow">序号箭头</option></select></label><label id="note-style-label" hidden>背景 <select id="note-style" aria-label="备注背景"><option value="">无</option><option value="#fff3b0">便签</option><option value="#ffffff">白色</option></select></label><label id="text-size-label" hidden>字号 <select id="edit-font-size" aria-label="文字字号"><option>16</option><option>24</option><option selected>32</option><option>48</option><option>64</option><option>96</option></select></label><label id="mosaic-size-label" hidden>块大小 <select id="edit-block-size" aria-label="马赛克块大小"><option value="8">8 px</option><option value="16" selected>16 px</option><option value="32">32 px</option><option value="64">64 px</option></select></label></div>
    <div class="history-actions"><button id="delete-edit" aria-label="删除标注" data-image-action title="删除选中标注 · Delete" hidden>⌫</button><button id="undo-edit" aria-label="撤销" data-image-action title="撤销 · Ctrl/⌘ Z">↶ 撤销</button><button id="redo-edit" aria-label="重做" data-image-action title="重做 · Ctrl/⌘ Shift Z">↷ 重做</button></div>
    <div class="inplace-actions inplace-only" role="group" aria-label="截图完成操作">
      <button id="overlay-pin" data-image-action data-export-action aria-label="固定截图到桌面" title="将编辑后的图片固定在桌面，不保存或复制"><svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 8 0-1 6 4 4v2H5v-2l4-4Zm4 12v7"/></svg></button>
      <button id="overlay-save" data-image-action data-export-action aria-label="下载截图" title="保存到设置中的截图目录 · Ctrl/⌘ S">↓</button>
      <button id="overlay-cancel" aria-label="取消截图" title="丢弃本次截图 · Esc">×</button>
      <button id="overlay-copy" data-image-action data-export-action aria-label="复制截图并完成" title="复制编辑后的图片并完成 · Enter">✓</button>
    </div>
  </nav>
  <div id="overlay-info" class="inplace-only" aria-live="polite"></div>
  <main id="editor-workspace"><div id="empty-state"><div class="empty-icon">▧</div><h1>在这里，给图片加一点说明</h1><p>使用截图快捷键（默认 F1），或打开本地 PNG / JPEG。</p><p class="muted">只在本机编辑，不识别文字，不上传图片。</p></div>
    <div id="canvas-frame" hidden><canvas id="image-canvas" role="img" aria-label="图片预览；使用工具栏添加标注" tabindex="0"></canvas><svg id="gesture-preview" aria-hidden="true"><rect id="gesture-rect"/><line id="gesture-line"/><rect id="object-selection" visibility="hidden"/></svg></div>
  </main>
  <aside class="editor-note"><span id="tool-hint">拖动绘制矩形。所有标注均以原始图片像素为准。</span><span>隐私内容建议使用「实心遮挡」，不要只依赖马赛克。</span></aside>
  <footer class="editor-footer"><div><span id="image-info">没有打开的图片</span><span id="save-indicator"></span></div><div class="zoom-controls"><button id="zoom-out" data-image-action aria-label="缩小">−</button><output id="zoom-level">100%</output><button id="zoom-in" data-image-action aria-label="放大">＋</button><button id="zoom-fit" data-image-action>适合窗口</button><button id="zoom-actual" data-image-action>100%</button></div></footer>
  <div class="status-line" id="editor-status" role="status" aria-live="polite">图片只会在点击保存后写入文件；保存为合并后的 PNG。</div>
  <section id="text-dialog" class="inline-text-editor" aria-label="原位编辑文字" hidden><form id="text-form"><textarea id="annotation-text" maxlength="2000" rows="2" placeholder="在这里写说明…" aria-label="标注文字"></textarea><div class="inline-text-actions"><span id="text-count">0 / 2000</span><button type="button" id="cancel-text" title="取消文字 · Esc">取消</button><button type="submit" id="apply-text" class="primary" title="提交文字 · Ctrl/⌘ Enter">完成文字</button></div><small>Enter 换行 · Ctrl/⌘ Enter 完成</small></form></section>
  <dialog id="discard-dialog" aria-labelledby="discard-title"><h2 id="discard-title">还没有保存这张图片</h2><p id="discard-description">关闭后，本次图片和编辑内容将被丢弃。不会自动保存。</p><div class="dialog-bottom"><button id="discard-cancel">继续编辑</button><button id="discard-confirm" class="danger">丢弃并关闭</button></div></dialog>
  <script type="module" src="/src/screenshot-editor.ts"></script>
</body></html>
