<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>截图 · EchoLingo</title></head>
<body>
  <header class="editor-header"><div class="editor-brand"><span class="brand-icon">E</span><div><strong>截图</strong><small>EchoLingo · 回声译</small></div></div>
    <div class="file-actions"><button id="open-image" title="打开本地 PNG / JPEG · Ctrl/⌘ O">打开图片</button><button id="copy-image" data-image-action data-export-action title="复制已合并的图片 · Ctrl/⌘ C">复制</button><button id="save-image" data-image-action data-export-action class="primary" title="保存到截图目录 · Ctrl/⌘ S">保存</button><button id="save-as-image" data-image-action data-export-action title="另存为 PNG · Ctrl/⌘ Shift S">另存为</button><button id="close-editor" aria-label="关闭截图编辑器">关闭</button></div>
  </header>
  <nav class="editor-toolbar" aria-label="图片编辑工具">
    <div class="tool-group" role="group" aria-label="标注工具">
      <button data-tool="rectangle" aria-label="矩形" data-image-action aria-pressed="true" title="矩形 · R">▢ <span>矩形</span></button>
      <button data-tool="arrow" aria-label="箭头" data-image-action aria-pressed="false" title="箭头 · A">↗ <span>箭头</span></button>
      <button data-tool="text" aria-label="文字" data-image-action aria-pressed="false" title="文字 · T">T <span>文字</span></button>
      <button data-tool="mosaic" aria-label="马赛克" data-image-action aria-pressed="false" title="马赛克 · M">▦ <span>马赛克</span></button>
      <button data-tool="solid" aria-label="实心遮挡" data-image-action aria-pressed="false" title="实心遮挡 · B">■ <span>实心遮挡</span></button>
      <button data-tool="crop" aria-label="裁剪" data-image-action aria-pressed="false" title="裁剪 · X">⌗ <span>裁剪</span></button>
    </div>
    <div class="tool-options"><label>颜色 <input id="edit-color" type="color" value="#e45d68" aria-label="标注颜色"/></label><label>线宽 <select id="edit-width" aria-label="线宽"><option value="2">细</option><option value="4" selected>中</option><option value="8">粗</option><option value="16">特粗</option></select></label><label id="text-size-label" hidden>字号 <select id="edit-font-size" aria-label="文字字号"><option>16</option><option>24</option><option selected>32</option><option>48</option><option>64</option><option>96</option></select></label><label id="mosaic-size-label" hidden>块大小 <select id="edit-block-size" aria-label="马赛克块大小"><option value="8">8 px</option><option value="16" selected>16 px</option><option value="32">32 px</option><option value="64">64 px</option></select></label></div>
    <div class="history-actions"><button id="undo-edit" aria-label="撤销" data-image-action title="撤销 · Ctrl/⌘ Z">↶ 撤销</button><button id="redo-edit" aria-label="重做" data-image-action title="重做 · Ctrl/⌘ Shift Z">↷ 重做</button></div>
  </nav>
  <main id="editor-workspace"><div id="empty-state"><div class="empty-icon">▧</div><h1>在这里，给图片加一点说明</h1><p>使用截图快捷键（默认 F1），或打开本地 PNG / JPEG。</p><p class="muted">只在本机编辑，不识别文字，不上传图片。</p></div>
    <div id="canvas-frame" hidden><canvas id="image-canvas" role="img" aria-label="图片预览；使用工具栏添加标注" tabindex="0"></canvas><svg id="gesture-preview" aria-hidden="true"><rect id="gesture-rect"/><line id="gesture-line"/></svg></div>
  </main>
  <aside class="editor-note"><span id="tool-hint">拖动绘制矩形。所有标注均以原始图片像素为准。</span><span>隐私内容建议使用「实心遮挡」，不要只依赖马赛克。</span></aside>
  <footer class="editor-footer"><div><span id="image-info">没有打开的图片</span><span id="save-indicator"></span></div><div class="zoom-controls"><button id="zoom-out" data-image-action aria-label="缩小">−</button><output id="zoom-level">100%</output><button id="zoom-in" data-image-action aria-label="放大">＋</button><button id="zoom-fit" data-image-action>适合窗口</button><button id="zoom-actual" data-image-action>100%</button></div></footer>
  <div class="status-line" id="editor-status" role="status" aria-live="polite">图片只会在点击保存后写入文件；保存为合并后的 PNG。</div>
  <dialog id="text-dialog" aria-labelledby="text-dialog-title"><form id="text-form"><h2 id="text-dialog-title">添加文字</h2><p>支持中文输入法；Enter 换行，Ctrl/⌘ Enter 添加。超出图片的文字会被裁切。</p><textarea id="annotation-text" maxlength="2000" rows="5" placeholder="输入文字…" aria-label="标注文字"></textarea><div class="dialog-bottom"><span id="text-count">0 / 2000</span><button type="button" id="cancel-text">取消</button><button type="submit" id="apply-text" class="primary">添加文字</button></div></form></dialog>
  <dialog id="discard-dialog" aria-labelledby="discard-title"><h2 id="discard-title">还没有保存这张图片</h2><p id="discard-description">关闭后，本次图片和编辑内容将被丢弃。不会自动保存。</p><div class="dialog-bottom"><button id="discard-cancel">继续编辑</button><button id="discard-confirm" class="danger">丢弃并关闭</button></div></dialog>
  <script type="module" src="/src/screenshot-editor.ts"></script>
</body></html>
