[package]
name = "echolingo"
version = "0.2.4"
description = "EchoLingo: lightweight translation and offline OCR"
authors = ["Blueeeecho"]
edition = "2021"
rust-version = "1.90"
license-file = "../LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
getrandom = "0.3"
whatlang = "=0.18.0"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "process", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.15", default-features = false }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "=0.8.0"
png = "0.18.1"
regex = "1.13.1"
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com"] }
windows-future = "0.3.2"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
keyring = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
